name: accommodation-booking-db

services:
  mysql:
    image: mysql:8.4

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the project .env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: accommodation_booking
      TZ: UTC

    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+00:00"

    volumes:
      - booking_mysql84_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql --protocol=TCP -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  booking_mysql84_data:
